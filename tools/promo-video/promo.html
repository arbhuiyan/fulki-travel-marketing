<!doctype html>
<!-- Source of the promo videos in assets/video: 20 s, vertical (1080×1920).
     The page is a pure function of time: window.render(t) draws the frame at t seconds.
     ?promo=<name> picks the promo (promos/<name>.js: regions by default, bangladesh, ...); ?lang=en|it|bn the copy.
     Render with: node tools/promo-video/render_promo.mjs [--promo name] -->
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  // load the promo's content: promos/<name>.js (?promo=regions by default)
  document.write('<script src="promos/' + (new URLSearchParams(location.search).get("promo") || "regions").replace(/[^a-z0-9-]/g, "") + '.js"><\/script>');
</script>
<style>
  @font-face { font-family: "Outfit"; src: url("../../assets/fonts/outfit.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Manrope"; src: url("../../assets/fonts/manrope.woff2") format("woff2"); font-weight: 200 800; }
  /* Bengali text falls back to Noto Sans Bengali (SIL Open Font License); Latin text is unaffected */
  @font-face { font-family: "Noto Sans Bengali"; src: url("fonts/noto-sans-bengali.woff2") format("woff2"); font-weight: 500 800; unicode-range: U+0951-0952, U+0964-0965, U+0980-09FE, U+200C-200D, U+25CC; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; }
  body { position: relative; overflow: hidden; background: #0c0a09; color: #fff; font-family: "Manrope", "Noto Sans Bengali", sans-serif; }
  #stage { position: absolute; inset: 0; }
  .layer { position: absolute; left: 0; right: 0; will-change: transform, opacity; }

  .brand { top: 84px; left: 72px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 74px; height: 74px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .brand b { font: 700 46px/1 "Outfit", "Noto Sans Bengali", sans-serif; letter-spacing: -0.02em; text-shadow: 0 2px 16px rgba(0,0,0,.25); }

  .intro { top: 0; height: 1920px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  .intro img { width: 220px; height: 220px; border-radius: 40px; box-shadow: 0 20px 60px rgba(234,88,12,.35); }
  .intro h1 { font: 800 112px/1.02 "Outfit", "Noto Sans Bengali", sans-serif; letter-spacing: -0.035em; text-align: center; }
  .intro h1 em { font-style: normal; color: #ea580c; }

  .title { top: 250px; padding: 0 72px; }
  .title small { display: block; font: 700 40px/1 "Manrope", "Noto Sans Bengali", sans-serif; letter-spacing: .22em; text-transform: uppercase; opacity: .85; margin-bottom: 14px; }
  .title h2 { font: 800 172px/0.95 "Outfit", "Noto Sans Bengali", sans-serif; letter-spacing: -0.04em; white-space: nowrap; transform-origin: left center; text-shadow: 0 6px 40px rgba(0,0,0,.25); }

  .board { top: 560px; left: 60px; right: 60px; padding: 26px 26px 30px; border-radius: 28px;
    background: rgba(12,10,9,.88); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.06); }
  .board header { display: flex; align-items: center; gap: 14px; font: 800 30px/1 "Manrope", "Noto Sans Bengali", sans-serif; letter-spacing: .24em; color: #fbbf24; margin: 2px 6px 22px; }
  .board header svg { width: 36px; height: 36px; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  .cell { position: relative; width: 74px; height: 92px; border-radius: 9px; overflow: hidden;
    background: linear-gradient(#26221f 0 50%, #1c1917 50% 100%);
    font: 700 62px/92px "Outfit", "Noto Sans Bengali", sans-serif; text-align: center; color: #fafaf9; }
  .cell::after { content: ""; position: absolute; left: 0; right: 0; top: 45px; height: 2px; background: #0c0a09; }
  .cell.code { color: #fb923c; }
  .cell.gap { width: 20px; background: none; }
  .cell.gap::after { display: none; }
  .cell.flip { background: linear-gradient(#34302c 0 50%, #1c1917 50% 100%); }

  .outro { top: 0; height: 1920px; display: flex; flex-direction: column; align-items: center; padding-top: 500px; text-align: center; }
  .flaps { display: flex; gap: 14px; }
  .fc { position: relative; width: 138px; height: 200px; perspective: 700px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)); }
  .fc .half { position: absolute; left: 0; right: 0; height: 100px; overflow: hidden; backface-visibility: hidden; }
  .fc .t { top: 0; border-radius: 16px 16px 0 0; background: #292524; transform-origin: 50% 100%; }
  .fc .b { top: 100px; border-radius: 0 0 16px 16px; background: #1c1917; transform-origin: 50% 0; border-top: 3px solid #0c0a09; }
  .fc .ft, .fc .fb { z-index: 2; visibility: hidden; }
  .fc span { display: block; height: 200px; font: 800 150px/200px "Outfit", "Noto Sans Bengali", sans-serif; text-align: center; color: #fafaf9; }
  .fc .b span { margin-top: -103px; }
  .fc span svg { display: block; width: 112px; height: 112px; margin: 44px auto 0; }
  .contrail { margin-top: 34px; width: 880px; height: 6px; border-radius: 3px; transform-origin: left center;
    background: linear-gradient(90deg, rgba(234,88,12,0), rgba(234,88,12,.75) 55%, #ea580c); }
  .outro .tt { margin-top: 34px; font: 600 48px/1 "Manrope", "Noto Sans Bengali", sans-serif; letter-spacing: .42em; padding-left: .42em; color: #e7e5e4; }
  .outro .tag { margin-top: 110px; font: 800 74px/1.05 "Outfit", "Noto Sans Bengali", sans-serif; letter-spacing: -0.03em; padding: 0 70px; }
  .outro .tag em { font-style: normal; background: linear-gradient(100deg, #ea580c, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .outro .sub { margin-top: 30px; font: 700 40px/1.3 "Manrope", "Noto Sans Bengali", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #fdba74; }
  .outro .pill { margin-top: 70px; display: inline-flex; align-items: center; gap: 18px; padding: 26px 44px; border-radius: 999px;
    background: #ea580c; font: 800 52px/1 "Manrope", "Noto Sans Bengali", sans-serif; box-shadow: 0 20px 60px rgba(234,88,12,.4); }
  .outro .pill svg { width: 54px; height: 54px; }
  /* Bengali: no tracking (it breaks conjuncts) and room for the vowel signs above and below */
  html[lang="bn"] .intro h1, html[lang="bn"] .title h2, html[lang="bn"] .title small, html[lang="bn"] .board header,
  html[lang="bn"] .outro .tag, html[lang="bn"] .outro .sub { letter-spacing: 0; }
  html[lang="bn"] .intro h1, html[lang="bn"] .outro .tag { line-height: 1.35; }
  .outro .url { margin-top: 40px; font: 700 46px/1 "Manrope", "Noto Sans Bengali", sans-serif; letter-spacing: .02em; color: #fafaf9; }
</style>
</head>
<body>
<div id="stage">
  <svg id="world" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop id="sky0" offset="0" /><stop id="sky1" offset="0.55" /><stop id="sky2" offset="1" />
      </linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff7ed" stop-opacity=".9"/><stop offset=".35" stop-color="#fed7aa" stop-opacity=".45"/><stop offset="1" stop-color="#fed7aa" stop-opacity="0"/></radialGradient>
      <radialGradient id="emberGlow"><stop offset="0" stop-color="#ea580c" stop-opacity=".55"/><stop offset="1" stop-color="#ea580c" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1080" height="1920" fill="url(#sky)" />
    <circle id="ember" cx="540" cy="760" r="760" fill="url(#emberGlow)" />
    <g id="stars"></g>
    <mask id="crescent"><rect width="1080" height="1920" fill="#fff"/><circle cx="952" cy="186" r="44" fill="#000"/></mask>
    <g id="moon"><circle cx="930" cy="200" r="48" fill="#fef3c7" mask="url(#crescent)"/></g>
    <g id="suns"></g>
    <g id="scenes"></g>
    <filter id="tint"><feFlood flood-color="#ea580c"/><feComposite in2="SourceAlpha" operator="in"/></filter>
    <g id="skyline" filter="url(#tint)">
      <rect x="0" y="1772" width="1080" height="160" fill="#000"/>
    </g>
    <path id="trail" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 16" />
    <g id="plane"><g transform="translate(-30 -30) scale(2.5)"><path fill="#fff" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></g></g>
  </svg>

  <div class="layer intro" id="intro">
    <img src="../../assets/logo/f-board/fulki-f-flap-black-orange.svg" alt="" id="introIcon" />
    <h1 id="introText"></h1>
  </div>

  <div class="layer brand" id="brand">
    <img src="../../assets/logo/f-board/fulki-f-flap-black-orange.svg" alt="" />
    <b>Fulki Travel</b>
  </div>

  <div class="layer title" id="title"><small id="kicker"></small><h2 id="region"></h2></div>

  <div class="layer board" id="board">
    <header><svg viewBox="0 0 24 24" fill="#fbbf24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg><span id="boardHead"></span></header>
    <div id="rows"></div>
  </div>

  <div class="layer outro" id="outro">
    <div class="flaps" id="logoFlaps"></div>
    <div class="contrail" id="outTrail"></div>
    <div class="tt" id="outTT">TRAVEL &amp; TOURS</div>
    <div class="tag" id="outTag"></div>
    <div class="sub" id="outSub"></div>
    <div><span class="pill" id="outPill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>+39 0444 022494</span></div>
    <div class="url" id="outUrl">fulkitravels.com</div>
  </div>
</div>

<script>
// the promo's own content (copy, scenes, artwork) comes from promos/<name>.js, loaded in <head>
const CFG = window.PROMO;
const params = new URLSearchParams(location.search);
const lang = CFG.copy[params.get("lang")] ? params.get("lang") : "en";
const L = CFG.copy[lang];
document.documentElement.lang = lang;

// ---------- timeline ----------
const T = { cuts: [2.4, 5.8, 9.2, 12.6], end: 20, name: CFG.name, langs: CFG.langs, sound: CFG.sound, sounds: CFG.sounds };
const C = T.cuts;
const SCENES = (typeof CFG.scenes === "function" ? CFG.scenes(lang) : CFG.scenes).map(sc => ({ ...sc }));
SCENES.forEach((s, i) => { s.start = T.cuts[i]; s.end = T.cuts[i + 1]; });

// sky keyframes: [top, middle, bottom]; the intro and outro are always night
const SKY = { night: ["#0c0a09", "#1c1917", "#292524"], outro: ["#0c0a09", "#1c1917", "#2a0f05"], ...CFG.sky };
const SKY_KEYS = [[0, "night"], ...SCENES.map((sc, i) => [C[i], sc.id]), [C[3], "outro"]];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = x => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = (...n) => { let h = 2166136261; for (const v of n) { h ^= (v * 2654435761) >>> 0; h = Math.imul(h, 16777619) >>> 0; } return (h >>> 0) / 4294967296; };
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; };
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

// ---------- illustrated skylines ----------
function onion(cx, base, w, h) {
  const r = w / 2;
  return `M${cx - r} ${base} C${cx - r * 1.3} ${base - h * .45} ${cx - w * .2} ${base - h * .72} ${cx} ${base - h}` +
         ` C${cx + w * .2} ${base - h * .72} ${cx + r * 1.3} ${base - h * .45} ${cx + r} ${base}Z`;
}
const rect = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;
const tri = (x1, x2, apexX, apexY, base) => `M${x1} ${base}L${apexX} ${apexY}L${x2} ${base}Z`;

function minaret(cx, base, top, w, f) {
  let d = `M${cx - w / 2} ${base}L${cx - w * .42} ${top}L${cx + w * .42} ${top}L${cx + w / 2} ${base}Z`;
  for (const y of f.balconies) d += rect(cx - w * .8, y, w * 1.6, 10);
  if (f.cap === "dome") d += rect(cx - w * .6, top - 22, w * 1.2, 22) + onion(cx, top - 22, w * 1.2, w * 1.1);
  else d += tri(cx - w * .55, cx + w * .55, cx, top - w * 2.4, top);
  d += rect(cx - 2, top - (f.cap === "dome" ? 22 + w * 1.1 + 20 : w * 2.4 + 16), 4, 20);
  return d;
}

function frame(x, y, w, h, bars, th = 12) {
  // an open grille column: outline plus vertical bars (drawn with fill-rule evenodd)
  let d = rect(x, y, w, h) + rect(x + th, y + th, w - 2 * th, h - th);
  for (let i = 1; i <= bars; i++) d += rect(x + th + (w - 2 * th) * i / (bars + 1) - 3, y + th, 6, h - th);
  return d;
}

const SCENE_ART = CFG.art;
for (const s of SCENES) {
  const g = el("g", { id: "scene-" + s.id }, $("scenes"));
  const ctx = { b: el("g", {}, g), f: el("g", { id: "art-" + s.id }, el("g", {}, g)) };
  const [fn, back, front, accent] = SCENE_ART[s.id];
  fn.call(ctx, back, front, accent);
  s.g = g; s.back = ctx.b; s.front = ctx.f.parentNode;
}

SCENES.forEach((s, i) => {
  const u = el("use", { href: "#art-" + s.id }, $("skyline"));
  u.setAttribute("transform", `translate(${i * 360} ${1772 * (1 - 1 / 3)}) scale(${1 / 3})`);
});

// suns, one per entry in the promo's suns list
const SUNS = (CFG.suns || []).map(sp => {
  const g = el("g", {}, $("suns"));
  return { ...sp, g, halo: el("circle", { cx: 540, fill: "url(#sunGlow)" }, g), disc: el("circle", { cx: 540, fill: sp.color }, g) };
});

// stars, for a promo with a night scene
const STARS = [];
for (let i = 0; i < 70; i++) {
  const c = el("circle", { cx: hash(i, 1) * 1080, cy: hash(i, 2) * 1150, r: 1.5 + hash(i, 3) * 2.5, fill: "#fff" }, $("stars"));
  STARS.push([c, hash(i, 4) * 6.28, .4 + hash(i, 5) * .6]);
}
// ---------- text ----------
$("introText").innerHTML = L.intro;
$("kicker").textContent = L.kicker;
$("boardHead").textContent = L.board;  // a scene with a `to` code adds it, e.g. "DEPARTURES → DAC"
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="width:30px;height:30px;margin:0 16px 0 14px;vertical-align:-6px"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
$("outTag").innerHTML = L.tag;
$("outSub").textContent = L.sub;

// outro: F U L K I flip in one after another, then the plane lands in the last flap
const PLANE = '<svg viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><path fill="#ea580c" stroke="#ea580c" stroke-width="1" stroke-linejoin="round" d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></g></svg>';
const LOGO = ["F", "U", "L", "K", "I", "✈"], FLIP = 0.09, STEP = 0.1;
const glyph = ch => ch === "✈" ? PLANE : ch;
const LOGO_FLAPS = LOGO.map((target, k) => {
  const box = document.createElement("div"); box.className = "fc"; $("logoFlaps").appendChild(box);
  const part = cls => { const h = document.createElement("div"); h.className = "half " + cls; h.appendChild(document.createElement("span")); box.appendChild(h); return h; };
  const start = C[3] + 0.3 + k * 0.22, n = 4 + k, seq = [[-1, " "]];
  for (let j = 0; j < n; j++) seq.push([start + j * STEP, "ABCDEFGHJKLMNOPRSTUVWXYZ"[Math.floor(hash(k, j, 5) * 24)]]);
  seq.push([start + n * STEP, target]);
  return { t: part("t"), b: part("b"), ft: part("t ft"), fb: part("b fb"), seq };
});
const LANDED = LOGO_FLAPS[5].seq.at(-1)[0] + FLIP;
function put(h, ch) { if (h.dataset.ch !== ch) { h.dataset.ch = ch; h.firstChild.innerHTML = glyph(ch); } }
function flapLogo(t) {
  let moving = 0;
  for (const f of LOGO_FLAPS) {
    let i = 0;
    while (i + 1 < f.seq.length && f.seq[i + 1][0] <= t) i++;
    const next = f.seq[i][1], prev = f.seq[Math.max(0, i - 1)][1], p = i ? (t - f.seq[i][0]) / FLIP : 1;
    put(f.t, next); put(f.ft, prev); put(f.fb, next);
    if (p >= 1) { put(f.b, next); f.ft.style.visibility = f.fb.style.visibility = "hidden"; continue; }
    moving++;
    put(f.b, prev);
    const top = p < .5;
    f.ft.style.visibility = top ? "visible" : "hidden";
    f.fb.style.visibility = top ? "hidden" : "visible";
    f.ft.style.transform = `rotateX(${-180 * p}deg)`;
    f.fb.style.transform = `rotateX(${(1 - p) * 180}deg)`;
    f.ft.style.filter = `brightness(${1 - p})`;
    f.fb.style.filter = `brightness(${0.4 + 0.6 * (2 * p - 1)})`;
  }
  return moving;
}

// departures board: 3 rows of [code(3)] [gap] [city(8)]
const CODE = 3, CITY = 8, CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
const cells = [];
for (let r = 0; r < 3; r++) {
  const row = document.createElement("div"); row.className = "row"; $("rows").appendChild(row);
  cells[r] = [];
  for (let c = 0; c < CODE + 1 + CITY; c++) {
    const d = document.createElement("div");
    d.className = "cell" + (c < CODE ? " code" : c === CODE ? " gap" : "");
    row.appendChild(d);
    if (c !== CODE) cells[r].push(d);
  }
}
// every board change: each scene's first set at its start, its second set 1.65 s later
const BOARDS = SCENES.flatMap(sc => sc.sets.map((rows, j) => ({ at: sc.start + j * 1.65, rows })));
const rowText = (b, r) => b ? (b.rows[r][0] + b.rows[r][1].padEnd(CITY)).slice(0, CODE + CITY) : " ".repeat(CODE + CITY);

function flapChar(t, r, c) {
  // which board is (or is becoming) current
  let k = -1;
  for (let i = 0; i < BOARDS.length; i++) if (t >= BOARDS[i].at - 0.05) k = i;
  if (k < 0) return [" ", false];
  const target = rowText(BOARDS[k], r)[c];
  const prev = rowText(BOARDS[k - 1], r)[c];
  const s = BOARDS[k].at + 0.05 + r * 0.12 + c * 0.028;
  const e = s + 0.28 + hash(r, c, k) * 0.3;
  if (t < s) return [prev, false];
  if (t >= e) return [target, false];
  if (target === " " && prev === " " && hash(r, c, k, 9) < .6) return [" ", false];
  return [CHARS[Math.floor(hash(Math.floor(t * 30), r, c, k) * CHARS.length)], true];
}

let flipping = 0;
function setT(id, x, y, o, s = 1) { const e = $(id); e.style.transform = `translate(${x}px, ${y}px) scale(${s})`; e.style.opacity = o; }

// ---------- frame ----------
window.render = function (t) {
  // sky
  let a = SKY_KEYS[0], b = SKY_KEYS[0];
  for (let i = 0; i < SKY_KEYS.length; i++) if (t >= SKY_KEYS[i][0] - 0.3) { a = SKY_KEYS[Math.max(0, i - 1)]; b = SKY_KEYS[i]; }
  const k = easeInOut(prog(t, b[0] - 0.3, b[0] + 0.3));
  [0, 1, 2].forEach(i => $("sky" + i).setAttribute("stop-color", mix(SKY[a[1]][i], SKY[b[1]][i], k)));

  // ember glow: intro and outro only
  $("ember").setAttribute("opacity", Math.max(1 - prog(t, C[0] - 0.2, C[0] + 0.2), prog(t, C[3] - 0.1, C[3] + 0.4)) * (0.85 + 0.15 * Math.sin(t * 2)));

  // scenes rise in from below and sink away
  for (const s of SCENES) {
    const pin = easeOut(prog(t, s.start - 0.2, s.start + 0.6));
    const pout = easeIn(prog(t, s.end - 0.25, s.end + 0.35));
    const vis = pin > 0 && pout < 1;
    s.g.style.display = vis ? "" : "none";
    if (!vis) continue;
    const drift = (t - s.start) * 10;
    s.front.setAttribute("transform", `translate(${-drift} ${(1 - pin) * 520 + pout * 520})`);
    s.back.setAttribute("transform", `translate(${-drift * .4} ${(1 - pin) * 340 + pout * 340})`);
  }

  // suns: each fades in with its scene and sinks slowly through it
  for (const sp of SUNS) {
    const a = C[sp.scene], b = C[sp.scene + 1], y = sp.y0 + (sp.y1 - sp.y0) * prog(t, a, b);
    sp.g.setAttribute("opacity", prog(t, a - 0.1, a + 0.4) * (1 - prog(t, b - 0.2, b + 0.2)));
    sp.disc.setAttribute("r", sp.r); sp.disc.setAttribute("cy", y);
    sp.halo.setAttribute("r", sp.r * 2.4); sp.halo.setAttribute("cy", y);
  }

  // night sky: stars + crescent, for the promo's night scene
  const nightAt = CFG.night ?? -1;
  const night = nightAt < 0 ? 0 : prog(t, C[nightAt] - 0.2, C[nightAt] + 0.4) * (1 - prog(t, C[nightAt + 1] - 0.2, C[nightAt + 1] + 0.3));
  $("stars").setAttribute("opacity", night);
  for (const [c, ph, base] of STARS) c.setAttribute("opacity", base * (0.6 + 0.4 * Math.sin(t * 5 + ph)));
  $("moon").setAttribute("opacity", night);
  $("moon").setAttribute("transform", `translate(0 ${(1 - easeOut(prog(t, C[Math.max(0, nightAt)] - 0.2, C[Math.max(0, nightAt)] + 0.5))) * 60})`);

  // plane flyby at each cut, leaving a dotted contrail
  let fly = null;
  for (const c of T.cuts) if (t >= c - 0.6 && t <= c + 1.0) fly = c;
  if (fly !== null) {
    const pt = u => { const v = 1 - u; return [v * v * -140 + 2 * v * u * 540 + u * u * 1240, v * v * 1240 + 2 * v * u * 880 + u * u * 1060]; };
    const u = easeInOut(prog(t, fly - 0.6, fly + 0.5));
    const [x, y] = pt(u), [x2, y2] = pt(Math.min(1, u + 0.01));
    const ang = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI + 45;
    $("plane").setAttribute("transform", `translate(${x} ${y}) rotate(${ang})`);
    $("plane").setAttribute("opacity", u < 1 ? 1 : 0);
    let d = "";
    for (let i = 0; i <= 40; i++) { const [px, py] = pt(u * i / 40); d += (i ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); }
    $("trail").setAttribute("d", d);
    $("trail").setAttribute("opacity", 0.75 * (1 - prog(t, fly + 0.4, fly + 1.0)));
  } else { $("plane").setAttribute("opacity", 0); $("trail").setAttribute("opacity", 0); }

  // intro
  const iIn = backOut(prog(t, 0.1, 0.6)), iOut = easeIn(prog(t, C[0] - 0.3, C[0] + 0.05));
  setT("intro", 0, -iOut * 160, Math.min(prog(t, 0, 0.25), 1 - iOut), 1 + 0.05 * easeInOut(prog(t, 0.6, C[0])));
  $("introIcon").style.transform = `scale(${0.6 + 0.4 * iIn}) rotateX(${(1 - easeOut(prog(t, 0.1, 0.55))) * 90}deg)`;
  $("introText").style.transform = `translateY(${(1 - easeOut(prog(t, 0.55, 1.05))) * 50}px)`;
  $("introText").style.opacity = prog(t, 0.55, 0.9);

  // brand chip
  setT("brand", 0, (1 - easeOut(prog(t, C[0] - 0.15, C[0] + 0.25))) * -30, prog(t, C[0] - 0.15, C[0] + 0.2) * (1 - prog(t, C[3] - 0.2, C[3] + 0.1)));

  // region title
  let ti = -1;
  for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i].start - 0.05) ti = i;
  if (ti >= 0 && t < SCENES[2].end) {
    const s = SCENES[ti], pin = easeOut(prog(t, s.start, s.start + 0.4)), pout = easeIn(prog(t, s.end - 0.3, s.end - 0.02));
    $("region").textContent = L.titles[ti];
    const head = L.board + (s.to ? ARROW + s.to : "");
    if ($("boardHead").innerHTML !== head) $("boardHead").innerHTML = head;
    const h2 = $("region"), fit = Math.min(1, 936 / h2.scrollWidth);
    h2.style.transform = `scale(${fit})`;
    setT("title", (1 - pin) * 80 - pout * 80, 0, pin * (1 - pout));
  } else $("title").style.opacity = 0;

  // departures board
  const bIn = easeOut(prog(t, C[0] - 0.15, C[0] + 0.25)), bOut = easeIn(prog(t, C[3] - 0.25, C[3] + 0.15));
  setT("board", 0, (1 - bIn) * 60 - bOut * 80, bIn * (1 - bOut));
  flipping = 0;
  for (let r = 0; r < 3; r++) for (let c = 0; c < CODE + CITY; c++) {
    const [ch, f] = flapChar(t, r, c), cell = cells[r][c];
    if (cell.textContent !== ch) cell.textContent = ch;
    cell.classList.toggle("flip", f);
    flipping += f;
  }

  // outro: flip in FULKI ✈, then the contrail, TRAVEL & TOURS, the line and the contacts
  const o = t - C[3];
  $("skyline").setAttribute("opacity", 0.4 * easeOut(prog(o, 0.2, 0.8)));
  $("skyline").setAttribute("transform", `translate(0 ${(1 - easeOut(prog(o, 0.2, 0.9))) * 120})`);
  $("outro").style.opacity = prog(o, 0, 0.2);
  flipping += 2 * flapLogo(t);
  const land = t - LANDED;
  $("logoFlaps").lastChild.style.transform = `translateY(${land > 0 ? -14 * Math.sin(Math.min(1, land / 0.25) * Math.PI) : 0}px)`;
  $("outTrail").style.transform = `scaleX(${easeOut(prog(land, 0, 0.4))})`;
  $("outTrail").style.opacity = prog(land, 0, 0.1);
  for (const [id, a0] of [["outTT", 0.15], ["outTag", 0.6], ["outSub", 1.0], ["outPill", 1.35], ["outUrl", 1.6]]) {
    $(id).style.opacity = prog(land, a0, a0 + 0.35);
    $(id).style.transform = `translateY(${(1 - easeOut(prog(land, a0, a0 + 0.5))) * 40}px)` + (id === "outPill" ? ` scale(${1 + 0.03 * Math.sin(Math.max(0, land - 1) * 5)})` : "");
  }
  return flipping;
};
window.TIMELINE = T;
render(0);
</script>
</body>
